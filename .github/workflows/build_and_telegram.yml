name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:     # Позволяет запускать вручную

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29.0.13846066
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13846066" || true

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Bcore Release AAR
        run: ./gradlew :Bcore:assembleRelease --stacktrace

      # Загрузка готовых файлов (Artifacts)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NewBlackbox-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Bcore Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: Bcore-Release-AAR
          path: Bcore/build/outputs/aar/*release.aar
          retention-days: 30
